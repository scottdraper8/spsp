[package]
name = "spsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "PolyForm-Strict-1.0.0"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[target.'cfg(windows)'.dependencies]
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "block_encoder", "instr_info"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
