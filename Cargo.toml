[package]
name = "spsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "PolyForm-Strict-1.0.0"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.151"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
