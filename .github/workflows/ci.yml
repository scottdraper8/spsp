name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Behavioral tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Run repository policy regression tests
        run: python3 -B -m unittest discover --start-directory tests
      - name: Run SPSP test suite
        run: cargo test --workspace --all-features --locked

  windows:
    name: Native Windows tests and DLL build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.98.1
      - name: Run native Windows tests
        run: cargo test --workspace --all-features --locked --target x86_64-pc-windows-msvc
      - name: Build release DLL
        run: cargo build --release --workspace --all-features --locked --target x86_64-pc-windows-msvc
      - name: Verify DLL artifact exists
        shell: pwsh
        run: |
          $dll = "target/x86_64-pc-windows-msvc/release/spsp.dll"
          if (-not (Test-Path $dll)) { throw "Release DLL was not produced: $dll" }
