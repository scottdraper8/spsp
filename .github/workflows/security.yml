name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Audit locked dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints:
            - github.com:443
            - api.github.com:443
            - codeload.github.com:443
            - raw.githubusercontent.com:443
            - static.rust-lang.org:443
            - index.crates.io:443
            - crates.io:443
            - static.crates.io:443
            - github-releases.githubusercontent.com:443
            - release-assets.githubusercontent.com:443
            - objects.githubusercontent.com:443
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1
      - name: Verify repository policy
        run: python3 -B scripts/check_policy.py
      - name: Install hash-verified cargo-audit
        env:
          CARGO_AUDIT_VERSION: 0.22.2
          CARGO_AUDIT_SHA256: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
        run: |
          archive="cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}.tgz"
          directory="cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}"
          path="$RUNNER_TEMP/$archive"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$path" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/$archive"
          printf '%s  %s\n' "$CARGO_AUDIT_SHA256" "$path" | sha256sum --check
          tar -xzf "$path" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$directory/cargo-audit" audit --file Cargo.lock --deny warnings
